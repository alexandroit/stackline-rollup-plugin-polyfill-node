name: CI

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: rollup-polyfill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-verify:
    name: Source verification / Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.20.2, 22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: node docs-site/prepare.mjs
      - run: node docs-site/check.mjs docs-site/dist

  package:
    name: Canonical packed artifact
    needs: source-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts
      - name: Build the canonical unpublished artifact
        env:
          STACKLINE_ARTIFACT_VALIDATION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run artifact:prepare
      - name: Record deterministic build inventory
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path'),crypto=require('crypto');const files=[];function walk(p){for(const name of fs.readdirSync(p).sort()){const f=path.join(p,name);const s=fs.statSync(f);if(s.isDirectory())walk(f);else files.push(f)}}walk('dist');files.push('src/polyfills.ts','sbom.cdx.json');const rows=files.sort().map(f=>[f.split(path.sep).join('/'),crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex')]);fs.writeFileSync('release-candidate/reproducibility-linux.json',JSON.stringify(rows,null,2)+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14

  packed-consumer:
    name: Node.js ${{ matrix.node }} / Rollup ${{ matrix.rollup }} packed consumer
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 14.21.3, rollup: 1.32.1 }
          - { node: 14.21.3, rollup: 2.79.2 }
          - { node: 14.21.3, rollup: 3.29.5 }
          - { node: 16.20.2, rollup: 3.29.5 }
          - { node: 18.20.8, rollup: 4.63.1 }
          - { node: 20.20.2, rollup: 4.63.1 }
          - { node: 22.22.3, rollup: 4.63.1 }
          - { node: 24.15.0, rollup: 4.63.1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - name: Install exact peer and packed plugin
        shell: bash
        run: |
          mkdir consumer
          cd consumer
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact "rollup@${{ matrix.rollup }}" ../artifact/*.tgz
          npm ls --all
          cp ../scripts/packed-matrix-consumer.cjs ./matrix-consumer.cjs
      - name: Exercise CommonJS entry and output
        working-directory: consumer
        run: node matrix-consumer.cjs cjs
      - name: Exercise ESM entry and build in a fresh process
        working-directory: consumer
        run: node matrix-consumer.cjs esm-build
      - name: Evaluate ESM output in another fresh process
        working-directory: consumer
        run: node matrix-consumer.cjs esm-evaluate

  platform-reproducibility:
    name: ${{ matrix.label }} clean-build reproducibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts
      - run: npm run test:compatibility
      - run: npm run check:reproducible
      - name: Record deterministic build inventory
        shell: bash
        run: |
          node -e "const fs=require('fs'),path=require('path'),crypto=require('crypto');const files=[];function walk(p){for(const name of fs.readdirSync(p).sort()){const f=path.join(p,name);const s=fs.statSync(f);if(s.isDirectory())walk(f);else files.push(f)}}walk('dist');files.push('src/polyfills.ts','sbom.cdx.json');const rows=files.sort().map(f=>[f.split(path.sep).join('/'),crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex')]);fs.mkdirSync('artifact',{recursive:true});fs.writeFileSync('artifact/reproducibility-${{ matrix.label }}.json',JSON.stringify(rows,null,2)+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-${{ matrix.label }}
          path: artifact/reproducibility-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 14

  compare-platforms:
    name: Compare Linux, macOS, and Windows build bytes
    needs: [package, platform-reproducibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: evidence/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-macos
          path: evidence/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproducibility-windows
          path: evidence/windows
      - name: Require identical generated bytes
        run: >-
          node -e "const fs=require('fs'),assert=require('assert');
          const linux=JSON.parse(fs.readFileSync('evidence/linux/reproducibility-linux.json'));
          const macos=JSON.parse(fs.readFileSync('evidence/macos/reproducibility-macos.json'));
          const windows=JSON.parse(fs.readFileSync('evidence/windows/reproducibility-windows.json'));
          assert.deepStrictEqual(macos,linux,'macOS build differs from Linux');
          assert.deepStrictEqual(windows,linux,'Windows build differs from Linux');"
